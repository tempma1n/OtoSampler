name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal macOS bundles
        run: ./build.sh

      - name: Verify Universal architectures and signatures
        run: |
          set -euo pipefail
          for bundle in "dist/Oto Sampler.vst3" "dist/Oto Sampler.component" "dist/Oto Sampler.app"; do
            bin="$bundle/Contents/MacOS/Oto Sampler"
            info="$(lipo -info "$bin")"
            echo "$info"
            echo "$info" | grep -q "x86_64"
            echo "$info" | grep -q "arm64"
          done
          codesign --verify --deep --strict --verbose=2 \
            "dist/Oto Sampler.vst3" \
            "dist/Oto Sampler.component" \
            "dist/Oto Sampler.app"

      - name: Install and validate Audio Unit (auval)
        run: |
          set -euo pipefail
          ./install.sh
          auval -v aumu Osmp Otoa || (killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 2; auval -v aumu Osmp Otoa)

      - name: Package macOS release archive
        run: ditto -c -k --norsrc dist OtoSampler-macOS-Universal.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtoSampler-macOS-Universal
          path: OtoSampler-macOS-Universal.zip
          if-no-files-found: error

      - name: Publish tag release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" OtoSampler-macOS-Universal.zip --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" OtoSampler-macOS-Universal.zip --generate-notes --repo "${GITHUB_REPOSITORY}"
          fi
